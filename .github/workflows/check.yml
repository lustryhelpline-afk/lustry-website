name: Website checks
on:
  push:
    branches: [v8-preview, main]
  pull_request:
    branches: [v8-preview, main]
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Select browser for regression tests
        shell: bash
        run: |
          # Ubuntu hosted runners already include Chrome and its dependencies.
          # Reuse that browser instead of repeating apt/browser installation.
          lustry_browser_path=""
          for lustry_browser_name in google-chrome google-chrome-stable chromium chromium-browser; do
            if lustry_browser_path="$(command -v "$lustry_browser_name")"; then
              break
            fi
          done
          if [ -n "$lustry_browser_path" ]; then
            printf 'LUSTRY_CHROMIUM_PATH=%s\n' "$lustry_browser_path" >> "$GITHUB_ENV"
            "$lustry_browser_path" --version
          else
            npx --no-install playwright install --with-deps chromium
          fi
      - run: npm test
      - run: npm run deploy:dry-run
